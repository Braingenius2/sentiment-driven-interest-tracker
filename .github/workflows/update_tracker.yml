name: Update live tracker data

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tracker/collect.py"
      - ".github/workflows/update_tracker.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tracker deps
        run: pip install requests pandas
      - name: Collect weekly data
        run: python tracker/collect.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/data
          git diff --cached --quiet || git commit -m "chore(tracker): weekly live data refresh [skip ci]" && git push
